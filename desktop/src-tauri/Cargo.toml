[package]
name = "player37-desktop"
version = "1.4.160"
description = "Audio player with a waveform seekbar and playlists"
authors = ["37 Player"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows issue,
# https://github.com/rust-lang/cargo/issues/8519).
name = "player37_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: right-click → Inspect Element in the test builds too
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2"
base64 = "0.22"
ureq = "3"
# A library's folder to the Trash / Recycle Bin (fs_root_trash, shell 2.5.2).
trash = "5"

[profile.release]
# Symbols in a separate .dSYM on the Mac (attached to each test build), so a
# crash report can be read; the app itself is still stripped.
debug = "line-tables-only"
split-debuginfo = "packed"
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# WebView2's ProcessFailed (shell 2.7.13): the same version wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"

[dev-dependencies]
minisign = "0.7"

# wry, patched: custom-protocol answers go to WebKit on the main thread (shell
# 2.5.8; see ../vendor/wry/PATCHED-FOR-37-PLAYER.md). Same version as the
# registry's, so nothing else moves.
[patch.crates-io]
wry = { path = "../vendor/wry" }
