[package]
name = "player37-desktop"
version = "0.1.0"
description = "37 Player desktop (Tauri spike)"
authors = ["Kelsang Rinzin"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows issue,
# https://github.com/rust-lang/cargo/issues/8519).
name = "player37_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: right-click → Inspect Element in the test builds too
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
