[package]
name = "player37-desktop"
version = "1.4.160"
description = "37 Player desktop (Tauri spike)"
authors = ["Kelsang Rinzin"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows issue,
# https://github.com/rust-lang/cargo/issues/8519).
name = "player37_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: right-click → Inspect Element in the test builds too
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2"
base64 = "0.22"
ureq = "3"

[profile.release]
# Symbols in a separate .dSYM on the Mac (attached to each test build), so a
# crash report can be read; the app itself is still stripped.
debug = "line-tables-only"
split-debuginfo = "packed"
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
minisign = "0.7"
