# The browser tests in WebKit (Safari's engine: iPads, Safari, the Mac desktop
# app) and Firefox, as well as Chrome, through Playwright (tests/engines/).
# The .zip fault of 5 Nov 2026 lived only in WebKit; tests run only in Chrome
# couldn't see it. Runs on a pull request to main, and when asked (Actions →
# "Tests in WebKit and Firefox" → Run workflow, once this file is on main).
# Free: standard Linux machines, public repository. The screenshots and each
# test's output are kept as an artifact for a week.
name: Tests in WebKit and Firefox
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests to run (empty: all)"
        required: false
        default: ""
# A newer push to the same pull request replaces a run still going.
concurrency:
  group: engines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What the tests need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg php-cli > /dev/null
          cd tests
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.65.0
          npx playwright install --with-deps ${{ matrix.engine }}
          ./make-fixtures.sh
      - name: Run the tests in ${{ matrix.engine }}
        run: |
          cd tests
          set -o pipefail
          LANG=C.UTF-8 ./run-engines.sh ${{ matrix.engine }} ${{ github.event.inputs.tests }} 2>&1 | tee engine-${{ matrix.engine }}.txt || true
          echo "### ${{ matrix.engine }}" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' engine-${{ matrix.engine }}.txt | grep -v -E '^\s*$' >> "$GITHUB_STEP_SUMMARY" || true
          # Each test that didn't pass: what it said (the artifact isn't always
          # reachable, the log is).
          for t in $(grep -E '^[a-z0-9-]+ +' engine-${{ matrix.engine }}.txt | grep -v -E 'ALL OK|skipped' | awk '{print $1}'); do
            echo "::group::$t"; grep -E '^(FAIL|PAGE ERROR|console)|Error|rror:|at .*\.js:[0-9]+' "shots/$t.out" | head -40; tail -5 "shots/$t.out"; echo "::endgroup::"
          done
          # Every test's line must end ALL OK (a crash leaves something else there).
          ! grep -E '^[a-z0-9-]+ +' engine-${{ matrix.engine }}.txt | grep -v -E 'ALL OK|skipped'
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.engine }}
          path: |
            tests/engine-${{ matrix.engine }}.txt
            tests/shots/
          retention-days: 7
