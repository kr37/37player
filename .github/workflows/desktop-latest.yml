name: Desktop app on the home page
# Puts one build's installers on a release under names that never change,
# which the home page links to: an "m" build (its pages follow main) on
# "desktop-latest", for 37player.com; a "d" build (dev's pages) on
# "desktop-latest-dev", for test.37player.com:
#   https://github.com/kr37/37player/releases/download/desktop-latest/37-Player-mac.dmg
#   …/37-Player-windows-setup.exe and …/37-Player-windows.msi
# Gen Rinzin chooses which build goes there (Actions → this workflow → Run
# workflow, with the build, "28m" say; empty means the newest m build), so a
# build reaches a home page only once he's happy with it. (Builds up to 27
# have no letter: they follow dev's pages.)
# A "d" build goes to desktop-latest-dev by itself as soon as it's built
# (Gen Rinzin, 11 Nov 2026: test.37player.com was still offering a build four
# days old); 37player.com's stays his choice. That needs this file on the
# default branch (main): GitHub only runs workflow_run from there. The build
# workflow has had two names, so both are listed.
on:
  workflow_run:
    workflows: ["Desktop app (test builds)", "Desktop app for the Mac (test build)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      test:
        description: "Build, as 28m or 28d (empty: the newest m build)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Copy the installers to desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          N: ${{ inputs.test }}
          AFTER_BUILD: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -e
          if [ "$AFTER_BUILD" = "true" ]; then
            # After a build: the newest d build, if it isn't there already.
            from=$(gh api "repos/$REPO/releases?per_page=50" --jq '[.[] | select(.tag_name | test("^desktop-test-[0-9]+d$"))][0].tag_name')
            if gh api "repos/$REPO/releases/tags/desktop-latest-dev" --jq .body 2>/dev/null | grep -q "from $from;"; then echo "$from is already on test.37player.com's home page"; exit 0; fi
          elif [ -n "$N" ]; then from="desktop-test-$N"
          else from=$(gh api "repos/$REPO/releases?per_page=50" --jq '[.[] | select(.tag_name | test("^desktop-test-[0-9]+m$"))][0].tag_name'); fi
          [ -n "$from" ] && [ "$from" != "null" ] || { echo "No such build"; exit 1; }
          case "$from" in *m) dest=desktop-latest; site=37player.com;; *) dest=desktop-latest-dev; site=test.37player.com;; esac
          title=$(gh api "repos/$REPO/releases/tags/$from" --jq .name)
          v=$(echo "$title" | grep -o '37 Player [0-9.]*' | sed 's/37 Player //')
          echo "From $from: $title"
          mkdir d && cd d
          gh release download "$from" --repo "$REPO" -p '*.dmg' -p '*.exe' -p '*.msi'
          mv ./*.dmg 37-Player-mac.dmg; mv ./*.exe 37-Player-windows-setup.exe; mv ./*.msi 37-Player-windows.msi
          notes="37 Player $v for computers (from $from; on $site's home page). Not signed yet: on a Mac, right-click the app → Open the first time; on Windows, SmartScreen → More info → Run anyway."
          files="37-Player-mac.dmg 37-Player-windows-setup.exe 37-Player-windows.msi"
          # The Linux .deb, in builds since 12 Nov 2026 (38d), when there is one.
          if gh release download "$from" --repo "$REPO" -p '*.deb' 2>/dev/null && ls ./*.deb > /dev/null 2>&1; then
            mv ./*.deb 37-Player-linux-amd64.deb; files="$files 37-Player-linux-amd64.deb"
            notes="$notes On Linux (Ubuntu 22.04 or newer and the like): sudo apt install ./37-Player-linux-amd64.deb"
          fi
          # The shell's update packages, and latest.json, which the app reads
          # to update itself (updates.rs, shell 2.2.3 on; 13 Nov 2026). Its
          # version is the app's (the "app x.y.z" in the build's title).
          sv=$(echo "$title" | grep -o 'app [0-9][0-9.]*' | sed 's/app //')
          gh release download "$from" --repo "$REPO" -p '*.app.tar.gz' -p '*.sig' 2>/dev/null || true
          base="https://github.com/$REPO/releases/download/$dest"
          plat='{}'
          if ls ./*.app.tar.gz > /dev/null 2>&1 && ls ./*.app.tar.gz.sig > /dev/null 2>&1; then
            mv ./*.app.tar.gz.sig 37-Player-mac.app.tar.gz.sig; mv ./*.app.tar.gz 37-Player-mac.app.tar.gz
            files="$files 37-Player-mac.app.tar.gz 37-Player-mac.app.tar.gz.sig"
            plat=$(jq --arg s "$(cat 37-Player-mac.app.tar.gz.sig)" --arg u "$base/37-Player-mac.app.tar.gz" '. + {"darwin-aarch64": {signature: $s, url: $u}, "darwin-x86_64": {signature: $s, url: $u}}' <<< "$plat")
          fi
          if ls ./*windows-setup.exe.sig > /dev/null 2>&1; then
            mv ./*windows-setup.exe.sig 37-Player-windows-setup.exe.sig
            files="$files 37-Player-windows-setup.exe.sig"
            plat=$(jq --arg s "$(cat 37-Player-windows-setup.exe.sig)" --arg u "$base/37-Player-windows-setup.exe" '. + {"windows-x86_64": {signature: $s, url: $u}}' <<< "$plat")
          fi
          if [ -n "$sv" ] && [ "$plat" != "{}" ]; then
            jq -n --arg v "$sv" --arg n "37 Player's app $sv (from $from)" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$plat" '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
            files="$files latest.json"
            echo "latest.json:"; cat latest.json | head -c 600; echo
          fi
          if gh release view "$dest" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$dest" $files --repo "$REPO" --clobber
            gh release edit "$dest" --repo "$REPO" --title "37 Player $v for computers" --notes "$notes"
          else
            gh release create "$dest" $files --repo "$REPO" --prerelease --title "37 Player $v for computers" --notes "$notes"
          fi
