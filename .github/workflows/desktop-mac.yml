# Builds the desktop app (Tauri) for the Mac, for testing: one .dmg that runs
# on Intel and Apple Silicon Macs, published as a pre-release that anyone can
# download without signing in. Unsigned: open it with right-click → Open.
name: Desktop app for the Mac (test build)
on:
  workflow_dispatch:
  push:
    branches: [tauri-spike]
    paths: ["desktop/**", "37-player.html", ".github/workflows/desktop-mac.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Publish as a pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          dmg=$(ls desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" "37-Player-mac-test.dmg"
          tag="mac-test-${{ github.run_number }}"
          gh release create "$tag" "37-Player-mac-test.dmg" --prerelease --target "${{ github.sha }}" \
            --title "37 Player for Mac, test build ${{ github.run_number }}" \
            --notes "Unsigned test build of the desktop app (Tauri) from branch tauri-spike, for desktop/SPIKE.md. Open with right-click → Open."
