# Builds the desktop app (Tauri) for testing: a .dmg for the Mac (Intel and
# Apple Silicon), Windows installers (.exe and .msi) and, since 12 Nov 2026,
# a Linux .deb (64-bit Intel/AMD; Ubuntu 22.04 and newer, Debian 12, Mint
# 21 and the like), published together as a pre-release anyone can download
# without signing in. Unsigned: on a Mac open it with right-click → Open; on
# Windows SmartScreen's "Run anyway". The shell's own tests (cargo test) run
# first, on each. A Linux build that fails doesn't hold up the others.
name: Desktop app (test builds)
on:
  # A push makes a build that follows dev's pages ("d"); one started by hand
  # can follow main's ("m"), for people other than Gen Rinzin (7 Nov 2026).
  workflow_dispatch:
    inputs:
      channel:
        description: "Pages the app follows: dev (test.37player.com's) or main (37player.com's)"
        type: choice
        options: [dev, main]
        default: dev
  push:
    branches: [tauri-spike]
    paths: ["desktop/**", "37-player.html", ".github/workflows/desktop-mac.yml"]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    # Test builds update their page from dev's (page-test; desktop/PAGE-UPDATES.md).
    env: { P37_PAGE_CHANNEL: "${{ inputs.channel == 'main' && 'latest' || 'test' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          npx tauri build --target universal-apple-darwin --bundles dmg
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../37-Player-mac-test.dmg
          # The debug symbols, kept apart (the app itself is stripped), so a
          # Mac crash report's addresses can be turned into lines (atos).
          (cd src-tauri/target && zip -qr ../../../37-Player-mac-test-symbols.zip */release/*.dSYM) || echo "no dSYMs"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "37-Player-mac-test*" }
  windows:
    runs-on: windows-latest
    env: { P37_PAGE_CHANNEL: "${{ inputs.channel == 'main' && 'latest' || 'test' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          npx tauri build
          cp src-tauri/target/release/bundle/nsis/*.exe ../37-Player-windows-test-setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi ../37-Player-windows-test.msi
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "37-Player-windows-test*" }
  linux:
    # 22.04, the oldest Ubuntu with WebKitGTK 4.1 (Tauri 2's), so the .deb
    # needs no newer libraries than most current Linux computers have.
    runs-on: ubuntu-22.04
    env: { P37_PAGE_CHANNEL: "${{ inputs.channel == 'main' && 'latest' || 'test' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file > /dev/null
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          npx tauri build --bundles deb
          cp src-tauri/target/release/bundle/deb/*.deb ../37-Player-linux-test.deb
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "37-Player-linux-test*" }
  publish:
    needs: [mac, windows, linux]
    # The Mac and Windows builds go out even if the Linux one failed.
    if: ${{ always() && needs.mac.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publish as a pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n="${{ github.run_number }}${{ inputs.channel == 'main' && 'm' || 'd' }}"
          tag="desktop-test-$n"
          # Named by the version first (Gen Rinzin, 7 Nov 2026), the build's
          # number after; the files carry the version too.
          v=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/37-player.html" | head -c 4000 | grep -o 'app-version" content="[^"]*' | head -1 | sed 's/.*content="//')
          # The app's own (shell's) version too, in the title: the page's
          # number alone hid that 31d was shell 2.2.1 (Gen Rinzin, 11 Nov 2026).
          sv=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/desktop/src-tauri/tauri.conf.json" | grep -o '"version": *"[^"]*' | head -1 | sed 's/.*"//')
          mv 37-Player-mac-test.dmg "37-Player-$v-mac.dmg"
          mv 37-Player-windows-test-setup.exe "37-Player-$v-windows-setup.exe"
          mv 37-Player-windows-test.msi "37-Player-$v-windows.msi"
          syms=""
          if [ -f 37-Player-mac-test-symbols.zip ]; then mv 37-Player-mac-test-symbols.zip "37-Player-$v-mac-symbols.zip"; syms="37-Player-$v-mac-symbols.zip"; fi
          deb=""
          if [ -f 37-Player-linux-test.deb ]; then mv 37-Player-linux-test.deb "37-Player-$v-linux-amd64.deb"; deb="37-Player-$v-linux-amd64.deb"; fi
          gh release create "$tag" "37-Player-$v-mac.dmg" "37-Player-$v-windows-setup.exe" "37-Player-$v-windows.msi" $deb $syms \
            --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
            --title "37 Player $v for computers (build $n, app $sv)" \
            --notes "The desktop app, not signed yet, from branch ${{ github.ref_name }}; its pages follow ${{ inputs.channel == 'main' && 'main (37player.com)' || 'dev (test.37player.com)' }}. Mac: right-click → Open. Windows: SmartScreen → More info → Run anyway. Linux (the .deb, Ubuntu 22.04 or newer and the like): sudo apt install ./37-Player-…-linux-amd64.deb"
