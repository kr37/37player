# Builds the desktop app (Tauri) for testing: a .dmg for the Mac (Intel and
# Apple Silicon; signed and notarized since 12 Nov 2026), Windows installers (.exe and .msi) and, since 12 Nov 2026,
# a Linux .deb (64-bit Intel/AMD; Ubuntu 22.04 and newer, Debian 12, Mint
# 21 and the like), published together as a pre-release anyone can download
# without signing in. Unsigned: on a Mac open it with right-click → Open; on
# Windows SmartScreen's "Run anyway". The shell's own tests (cargo test) run
# first, on each. A Linux build that fails doesn't hold up the others.
name: Desktop app (test builds)
on:
  # A push makes a build that follows dev's pages ("d"); one started by hand
  # can follow main's ("m"), for people other than Gen Rinzin (7 Nov 2026).
  workflow_dispatch:
    inputs:
      channel:
        description: "Pages the app follows: dev (test.37player.com's) or main (37player.com's)"
        type: choice
        options: [dev, main]
        default: dev
  push:
    branches: [tauri-spike]
    paths: ["desktop/**", "37-player.html", ".github/workflows/desktop-mac.yml"]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    # Test builds update their page from dev's (page-test; desktop/PAGE-UPDATES.md).
    env: { P37_PAGE_CHANNEL: "${{ inputs.channel == 'main' && 'latest' || 'test' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      # Signed with Gen Rinzin's Developer ID and notarized by Apple (12 Nov
      # 2026), so it opens without "can't be opened" or right-click → Open.
      # The six APPLE_* secrets: the certificate (.p12, base64) and its
      # password, the signing identity, and an App Store Connect API key
      # (its ID, its issuer, and the .p8). Without them (a fork), unsigned.
      - name: Signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No certificate: the build won't be signed"; exit 0; fi
          kc="$RUNNER_TEMP/p37.keychain-db"; kp=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # The identity as the certificate names it (a secret typed by hand
          # can carry a stray space).
          id=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$id" ] || { echo "No Developer ID Application identity in the certificate"; security find-identity -v -p codesigning "$kc"; exit 1; }
          echo "Signing as: $id"
          echo "APPLE_SIGNING_IDENTITY=$id" >> "$GITHUB_ENV"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "P37_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build
        working-directory: desktop
        env:
          # Tauri notarizes the signed app with these (and APPLE_API_KEY_PATH).
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # The shell's own updates (updates.rs) are signed with the key that
          # signs the pages; the app checks them with page-key.pub.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          if [ -z "$P37_SIGNED" ]; then unset APPLE_API_KEY APPLE_API_ISSUER; fi
          upd=""; [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && upd='{"bundle":{"createUpdaterArtifacts":true}}'
          npx tauri build --target universal-apple-darwin --bundles app,dmg ${upd:+--config "$upd"}
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../37-Player-mac-test.dmg
          # The update package (the .app, signed and notarized, as .tar.gz) and its signature.
          if [ -n "$upd" ]; then
            cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz ../37-Player-mac-test.app.tar.gz
            cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig ../37-Player-mac-test.app.tar.gz.sig
          fi
          if [ -n "$P37_SIGNED" ]; then
            # The .dmg too: notarized and stapled, so a downloaded one opens
            # without a warning even offline (the app inside already is).
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp ../37-Player-mac-test.dmg
            xcrun notarytool submit ../37-Player-mac-test.dmg --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            xcrun stapler staple ../37-Player-mac-test.dmg
            spctl -a -t open --context context:primary-signature -v ../37-Player-mac-test.dmg
            echo signed > ../37-Player-mac-test-signed.txt
          fi
          # The debug symbols, kept apart (the app itself is stripped), so a
          # Mac crash report's addresses can be turned into lines (atos).
          (cd src-tauri/target && zip -qr ../../../37-Player-mac-test-symbols.zip */release/*.dSYM) || echo "no dSYMs"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "37-Player-mac-test*" }
  windows:
    runs-on: windows-latest
    env: { P37_PAGE_CHANNEL: "${{ inputs.channel == 'main' && 'latest' || 'test' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          upd=""; [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && upd='{"bundle":{"createUpdaterArtifacts":true}}'
          npx tauri build ${upd:+--config "$upd"}
          cp src-tauri/target/release/bundle/nsis/*.exe ../37-Player-windows-test-setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi ../37-Player-windows-test.msi
          # The update package is the installer itself; this is its signature.
          if [ -n "$upd" ]; then cp src-tauri/target/release/bundle/nsis/*.exe.sig ../37-Player-windows-test-setup.exe.sig; fi
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "37-Player-windows-test*" }
  linux:
    # 22.04, the oldest Ubuntu with WebKitGTK 4.1 (Tauri 2's), so the .deb
    # needs no newer libraries than most current Linux computers have.
    runs-on: ubuntu-22.04
    env: { P37_PAGE_CHANNEL: "${{ inputs.channel == 'main' && 'latest' || 'test' }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file > /dev/null
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          npx tauri build --bundles deb
          cp src-tauri/target/release/bundle/deb/*.deb ../37-Player-linux-test.deb
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "37-Player-linux-test*" }
  publish:
    needs: [mac, windows, linux]
    # The Mac and Windows builds go out even if the Linux one failed.
    if: ${{ always() && needs.mac.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publish as a pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n="${{ github.run_number }}${{ inputs.channel == 'main' && 'm' || 'd' }}"
          tag="desktop-test-$n"
          # Named by the version first (Gen Rinzin, 7 Nov 2026), the build's
          # number after; the files carry the version too.
          v=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/37-player.html" | head -c 4000 | grep -o 'app-version" content="[^"]*' | head -1 | sed 's/.*content="//')
          # The app's own (shell's) version too, in the title: the page's
          # number alone hid that 31d was shell 2.2.1 (Gen Rinzin, 11 Nov 2026).
          sv=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/desktop/src-tauri/tauri.conf.json" | grep -o '"version": *"[^"]*' | head -1 | sed 's/.*"//')
          mv 37-Player-mac-test.dmg "37-Player-$v-mac.dmg"
          mv 37-Player-windows-test-setup.exe "37-Player-$v-windows-setup.exe"
          mv 37-Player-windows-test.msi "37-Player-$v-windows.msi"
          syms=""
          if [ -f 37-Player-mac-test-symbols.zip ]; then mv 37-Player-mac-test-symbols.zip "37-Player-$v-mac-symbols.zip"; syms="37-Player-$v-mac-symbols.zip"; fi
          macnote="Mac: right-click → Open."
          if [ -f 37-Player-mac-test-signed.txt ]; then rm 37-Player-mac-test-signed.txt; macnote="Mac: signed and notarized, opens normally."; fi
          deb=""
          if [ -f 37-Player-linux-test.deb ]; then mv 37-Player-linux-test.deb "37-Player-$v-linux-amd64.deb"; deb="37-Player-$v-linux-amd64.deb"; fi
          # The shell's update packages and signatures (updates.rs), when made.
          upd=""
          for f in mac-test.app.tar.gz mac-test.app.tar.gz.sig windows-test-setup.exe.sig; do
            if [ -f "37-Player-$f" ]; then n="37-Player-$v-${f/-test/}"; mv "37-Player-$f" "$n"; upd="$upd $n"; fi
          done
          gh release create "$tag" "37-Player-$v-mac.dmg" "37-Player-$v-windows-setup.exe" "37-Player-$v-windows.msi" $deb $upd $syms \
            --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
            --title "37 Player $v for computers (build $n, app $sv)" \
            --notes "The desktop app (Windows not signed yet), from branch ${{ github.ref_name }}; its pages follow ${{ inputs.channel == 'main' && 'main (37player.com)' || 'dev (test.37player.com)' }}. $macnote Windows: SmartScreen → More info → Run anyway. Linux (the .deb, Ubuntu 22.04 or newer and the like): sudo apt install ./37-Player-…-linux-amd64.deb"
