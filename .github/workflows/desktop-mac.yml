# Builds the desktop app (Tauri) for testing: a .dmg for the Mac (Intel and
# Apple Silicon) and Windows installers (.exe and .msi), published together
# as a pre-release anyone can download without signing in. Unsigned: on a
# Mac open it with right-click → Open; on Windows SmartScreen's "Run anyway".
# The shell's own tests (cargo test) run first, on each.
name: Desktop app (test builds)
on:
  workflow_dispatch:
  push:
    branches: [tauri-spike]
    paths: ["desktop/**", "37-player.html", ".github/workflows/desktop-mac.yml"]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    # Test builds update their page from dev's (page-test; desktop/PAGE-UPDATES.md).
    env: { P37_PAGE_CHANNEL: test }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          npx tauri build --target universal-apple-darwin --bundles dmg
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../37-Player-mac-test.dmg
          # The debug symbols, kept apart (the app itself is stripped), so a
          # Mac crash report's addresses can be turned into lines (atos).
          (cd src-tauri/target && zip -qr ../../../37-Player-mac-test-symbols.zip */release/*.dSYM) || echo "no dSYMs"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "37-Player-mac-test*" }
  windows:
    runs-on: windows-latest
    env: { P37_PAGE_CHANNEL: test }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          node copy-app.mjs
          (cd src-tauri && cargo test)
          npx tauri build
          cp src-tauri/target/release/bundle/nsis/*.exe ../37-Player-windows-test-setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi ../37-Player-windows-test.msi
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "37-Player-windows-test*" }
  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publish as a pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="desktop-test-${{ github.run_number }}"
          # GitHub's list cuts titles short, so the number comes first.
          v=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/37-player.html" | head -c 4000 | grep -o 'app-version" content="[^"]*' | head -1 | sed 's/.*content="//')
          syms=$(ls 37-Player-mac-test-symbols.zip 2>/dev/null || true)
          gh release create "$tag" 37-Player-mac-test.dmg 37-Player-windows-test-setup.exe 37-Player-windows-test.msi $syms \
            --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
            --title "Test ${{ github.run_number }}: 37 Player $v, desktop" \
            --notes "Unsigned test builds of the desktop app (Tauri) from branch tauri-spike (desktop/SPIKE.md). Mac: right-click → Open. Windows: SmartScreen → More info → Run anyway."
